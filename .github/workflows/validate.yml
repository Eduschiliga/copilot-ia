name: Validate Copilot configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install validator dependency
        shell: pwsh
        run: python -m pip install "PyYAML==6.0.2"

      - name: Regenerate custom agents
        shell: pwsh
        run: .\tools\generate-agents.ps1

      - name: Check generated agents are current
        shell: pwsh
        run: git diff --exit-code -- .github/agents

      - name: Validate package
        shell: pwsh
        run: python -X utf8 .\tools\validate-package.py
